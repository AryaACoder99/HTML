<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero Card</title>
        <style>
            /* Typography - font, size, weight, coulor for the whole page */
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }
            /* Typography + Text Shadow - big bold title with an orange shadow*/
            .hero name{
                font-size: 60px;
                font-weight: bold;
                color: yellow
                text-shadow: 3px 3px orange;
            }

            /* Typography + Text Transform - tagline becomes Title Case*/
            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform:capitalize;
            }
        </style>
    </head>
</html>
