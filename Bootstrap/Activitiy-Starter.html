<!DOCTYPE html>
<html>
    <head>
        <title>My Hobby Cards</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            .col {text-align: center; border: 1px black}
            body {
                background-color: #f9f9f9;
                font-family: Arial, sans-serif;
                padding: 30px 15px;
            }
            h1 {
                text-align: center;
                color: #ff5a4a;
            }
            .hobby-card {
                text-align: center;
                border: 2px solid color: #ff5a4a;
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color: #fff8e1;
            }
            .hobby-card h3 {
                color:ff5a4a;
            }
        </style>
    </head>
    <body>
        <h1>My Hobby Cards</h1>
        <div class="container"> 
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Drawing</h3>
                        <p>I love drawing animals</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Volleyball</h3>
                        <p>I love playing volley because it is fun.</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Reading</h3>
                        <p>I love reading fantasy books.</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

        </script>
    </body>
</html>
